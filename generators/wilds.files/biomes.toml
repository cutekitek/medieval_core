# Biome parameters: 1 - temperature, 2 - humidity (both mapped to ~0.2..0.8).
# Rock under the soil depends on the biome (sedimentary near the surface,
# granite or basalt deep down); the generator script adds lenses of other
# rocks in between.
# Trees of tundra, taiga, tropics and desert are procedural (see script.lua),
# forest and plains keep the fragment trees.

[tundra]
parameters = [
    {weight=1, value=0.08},
    {weight=1, value=0.45}
]
layers = [
    {below-sea-level=false, height=1, block="medieval_core:snowy_dirt"},
    {below-sea-level=false, height=3, block="base:dirt"},
    {height=10, block="medieval_core:slate"},
    {height=-1, block="base:stone"},
    {height=24, block="medieval_core:granite"},
    {height=1, block="base:bazalt"}
]
sea-layers = [
    {height=1, block="base:ice"},
    {height=-1, block="base:water"}
]
plant-chance = 0.12
plants = [
    {weight=1, block="medieval_core:lichen"},
    {weight=0.35, block="medieval_core:dead_bush"},
    {weight=0.25, block="medieval_core:loose_rock"},
    {weight=0.08, block="medieval_core:loose_flint"},
    {weight=0.12, block="medieval_core:cloudberry_bush"}
]

